<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账户中心 · 基于多模态大模型的风电塔灾损测算平台</title>
<link rel="stylesheet" href="/screen-assets/screen.css">
<link rel="stylesheet" href="/screen-assets/hud-theme.css">
<style>
.sc-acct-wrap { display:flex; gap:14px; align-items:flex-start; }
.sc-acct-wrap .sc-panel { flex:1; min-width:380px; }
.sc-form { display:flex; flex-direction:column; gap:14px; max-width:420px; }
.sc-form label { font-size:13px; color:#CFE2F2; display:flex; flex-direction:column; gap:6px; }
.sc-form input { height:38px; border-radius:6px; padding:0 12px; font-size:14px;
  border:1px solid rgba(103,232,249,.35); background:rgba(7,20,40,.7); color:#EAF4FC; outline:none; }
.sc-form input:focus { border-color:#22D3EE; }
.sc-form .sc-btn { justify-content:center; }
.sc-msg { font-size:13px; padding:8px 12px; border-radius:6px; display:none; }
.sc-msg.ok { display:block; color:#34D399; background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.4); }
.sc-msg.err { display:block; color:#F87171; background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.5); }
table.sc-mini td, table.sc-mini th { padding:7px 8px; }
.sc-act { color:#22D3EE; cursor:pointer; margin-right:8px; }
.sc-act.danger { color:#F87171; }
.sc-rolesel { height:30px; border-radius:5px; border:1px solid rgba(103,232,249,.35);
  background:rgba(7,20,40,.7); color:#EAF4FC; }
</style>
</head>
<body class="sc-page mountain-hud">

<header class="sc-topbar">
  <div class="sc-logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
      <circle cx="12" cy="12" r="2.2" fill="#fff" stroke="none"/>
      <path d="M12 9.8V3.2M14 13.2l5.6 3.2M10 13.2L4.4 16.4"/>
    </svg>
  </div>
  <div class="sc-title">账户中心<small>ACCOUNT</small></div>
  <div class="sc-top-right">
    <a class="sc-btn" href="/screen" style="height:36px;padding:0 18px;font-size:13px">← 返回大屏</a>
  </div>
</header>

<div class="sc-subpage">
  <div class="sc-acct-wrap">
    <section class="sc-panel">
      <div class="sc-ph"><span class="sq"></span><span class="cn">修改密码</span><span class="en">PASSWORD</span></div>
      <form class="sc-form" id="pw-form">
        <label>当前密码<input type="password" id="pw-old" autocomplete="current-password" required></label>
        <label>新密码<input type="password" id="pw-new" autocomplete="new-password" required
          placeholder="≥8 位，需含字母和数字"></label>
        <label>确认新密码<input type="password" id="pw-new2" autocomplete="new-password" required></label>
        <div class="sc-msg" id="pw-msg"></div>
        <button class="sc-btn primary" type="submit">保存新密码</button>
      </form>
    </section>

    <section class="sc-panel" id="users-panel" hidden>
      <div class="sc-ph"><span class="sq"></span><span class="cn">用户管理</span><span class="en">USERS · ADMIN</span></div>
      <div style="overflow:auto;max-height:640px">
        <table class="sc-mini">
          <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="user-rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script src="/screen-assets/account.js"></script>
</body>
</html>
