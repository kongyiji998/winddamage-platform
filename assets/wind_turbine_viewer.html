    for(let i=0;i<n;i++){
      const g=new THREE.Group();
      const p=new THREE.Mesh(new THREE.BoxGeometry(6.6,.24,3.6),pvMat);p.position.y=2.0;p.rotation.x=.44;g.add(p);
      [-2.7,2.7].forEach(q=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,2),legMat);l.position.set(q,1,0);g.add(l);});
      const t=(i-(n-1)/2)*8;
      g.position.set(cx+lat.x*t,0,cz+lat.z*t);
      g.rotation.y=1.19;
      scene.add(g);
    }
  }
  pvRow(62,6);pvRow(82,7);pvRow(102,8);pvRow(126,8);pvRow(150,9);pvRow(172,9);
  // 沙色地面 + 干草配色 + 暖霾天空
  grass.material=new THREE.MeshStandardMaterial({color:sand,roughness:1});
  grassMat.color=new THREE.Color(0xa39872);
  scene.background=new THREE.Color(0xa5c0d4);
  scene.fog=new THREE.Fog(0xc2c3b4,105,230);
  // 皮肤主题切换会重设天空/草地颜色 → 戈壁模式下覆盖回沙色调
  const _applyThemeBase=applyTheme;
  applyTheme=function(t){
    _applyThemeBase(t);
    if(gobi){
      grass.material=new THREE.MeshStandardMaterial({color:sand,roughness:1});
      grassMat.color=new THREE.Color(0xa39872);
      scene.background=new THREE.Color(0xa5c0d4);
      scene.fog=new THREE.Fog(0xc2c3b4,105,230);
    }
  };
}
if(isBg){
  turbine.visible=false;
  controls.enabled=false;
  const hudEl=document.querySelector('.hud');
  if(hudEl)hudEl.style.display='none';
}
/* 中栏主 viewer 通过 ?env=gobi 也能换戈壁环境（保留风机与交互） */
if(__bgParms.get('bg')==='gobi'||__bgParms.get('env')==='gobi')setupGobi();
try{window.parent.postMessage({wdViewerReady:true},'*')}catch(err){}
/* 启动时读取父页面当前主题（iframe 可能晚于用户切肤加载） */
try{const pt=window.parent.document.documentElement.getAttribute('data-wd-theme');if(pt)applyTheme(pt)}catch(err){}
document.getElementById('spin').onclick=()=>{spinning=!spinning;document.getElementById('spin').textContent=spinning?'暂停叶轮':'启动叶轮'};document.getElementById('reset').onclick=()=>{camera.position.set(132,46,54);controls.target.set(0,35,0);controls.update()};
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();let last=performance.now(),elapsed=0;function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.08);last=now;elapsed+=dt;if(spinning)rotor.rotation.x+=dt*.62;distant.forEach((d,i)=>d.userData.rotor.rotation.x+=dt*(.35+i*.05));grassBlades.forEach(b=>{b.rotation.z=Math.sin(elapsed*2+b.userData.phase)*.10});clouds.forEach((c,i)=>{c.position.x+=dt*(.35+i*.08);if(c.position.x>78)c.position.x=-78});controls.update();updateCallout();renderer.render(scene,camera)}requestAnimationFrame(animate);
</script>
